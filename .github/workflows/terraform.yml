name: Terraform - API Gateway

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_ID: "043391333434"
  TF_ACTION: "apply" # apply or destroy
  AWS_REGION: "us-east-1"
  GITHUB_ROLE_NAME: "Github-Actions-Terraform-Role"
  TF_VAR_aws_db_instance_db_password: ${{secrets.RDS_DB_PASSWORD}}

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{env.AWS_ACCOUNT_ID}}:role/${{env.GITHUB_ROLE_NAME}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda (Java)
        working-directory: lambda
        run: mvn clean package

      - name: Terraform Init
        run: terraform init

        # Check if API Gateway exists and set API_ID env variable
      - name: Get API Gateway ID by name
        if: env.TF_ACTION == 'destroy'
        run: |
          API_ID=$(aws apigatewayv2 get-apis \
            --region $AWS_REGION \
            --query "Items[?Name=='example-http-api'].ApiId" \
            --output text)
          
          if [ -z "$API_ID" ]; then
            echo "✅ API Gateway não existe na AWS"
            exit 0
          fi
          
          echo "⚠️ API Gateway encontrado: $API_ID"
          echo "API_ID=$API_ID" >> $GITHUB_ENV


        # import Api Gateway in state
      - name: Terraform Import API Gateway
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          terraform state list | grep aws_apigatewayv2_api.http_api \
          || terraform import aws_apigatewayv2_api.http_api $API_ID

        # validates the import to see if the api gateway is in state
      - name: Validate API Gateway in Terraform state
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if terraform state list | grep -q aws_apigatewayv2_api.http_api; then
            echo "✅ API Gateway está presente no state do Terraform"
          else
            echo "❌ API Gateway NÃO está no state do Terraform"
            exit 1
          fi

        # import lambda in state
      - name: Terraform Import Lambda Function
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if aws lambda get-function \
            --function-name hello-world \
            --region $AWS_REGION > /dev/null 2>&1; then
          
            terraform state list | grep -q aws_lambda_function.helloworld \
            || terraform import aws_lambda_function.helloworld hello-world
          
            echo "✅ Lambda importada com sucesso no state"
          else
            echo "⚠️ Lambda não existe na AWS, nada para importar"
          fi

        # validates the import to see if the lambda is in state
      - name: Validate Lambda Function in Terraform state
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if terraform state list | grep -q aws_lambda_function.helloworld; then
            echo "✅ Lambda Function está presente no state do Terraform"
          else
            echo "❌ Lambda Function NÃO está no state do Terraform"
            exit 1
          fi

        # Import RDS in state
      - name: Terraform Import RDS Instance
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if aws rds describe-db-instances \
            --db-instance-identifier example-postgres-db \
            --region $AWS_REGION > /dev/null 2>&1; then
            
            terraform state list | grep -q aws_db_instance.postgres \
            || terraform import aws_db_instance.postgres example-postgres-db
            
            echo "✅ RDS Instance importada com sucesso no state"
          else
            echo "⚠️ RDS Instance não existe na AWS, nada para importar"
          fi

        # validates the import to see if the RDS instance is in state
      - name: Validate RDS Instance in Terraform state
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if terraform state list | grep -q aws_db_instance.postgres; then
            echo "✅ RDS Instance está presente no state do Terraform"
          else
            echo "❌ RDS Instance NÃO está no state do Terraform"
            exit 1
          fi

      # Import RDS Security Group
      - name: Terraform Import RDS Security Group
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              Name=group-name,Values=rds-postgres-sg \
              Name=vpc-id,Values=$VPC_ID \
            --query "SecurityGroups[0].GroupId" \
            --output text \
            --region $AWS_REGION)
          
          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
            terraform state list | grep -qx aws_security_group.rds_sg \
            || terraform import aws_security_group.rds_sg $SG_ID
          
            echo "✅ Security Group importado no state"
          else
            echo "⚠️ Security Group não encontrado, nada para importar"
          fi

        # validates the import to see if the RDS security group is in state
      - name: Validate RDS Security Group in Terraform state
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if terraform state list | grep -qx aws_security_group.rds_sg; then
            echo "✅ RDS Security Group está presente no state do Terraform"
          else
            echo "❌ RDS Security Group NÃO está no state do Terraform"
            exit 1
          fi

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply/Destroy
        working-directory: terraform
        run: terraform ${{env.TF_ACTION}} -auto-approve

        # validates the destroy by checking if the API Gateway still exists in AWS
      - name: Validate API Gateway is destroyed in AWS
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if aws apigatewayv2 get-api \
            --api-id $API_ID \
            --region $AWS_REGION > /dev/null 2>&1; then
            echo "❌ API Gateway ainda EXISTE na AWS após o destroy"
            exit 1
          else
            echo "✅ API Gateway NÃO existe mais na AWS (destroy confirmado)"
          fi

        # validates the destroy by checking if the Lambda Function still exists in AWS
      - name: Validate Lambda Function is destroyed in AWS
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          if aws lambda get-function \
            --function-name hello-world \
            --region $AWS_REGION > /dev/null 2>&1; then
            echo "❌ Lambda Function ainda EXISTE na AWS após o destroy"
            exit 1
          else
            echo "✅ Lambda Function NÃO existe mais na AWS (destroy confirmado)"
          fi

        # validates the destroy by checking if the RDS instance still exists in AWS
      - name: Validate RDS Instance is destroyed in AWS
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          STATUS=$(aws rds describe-db-instances \
          --db-instance-identifier example-postgres-db \
          --region $AWS_REGION \
          --query "DBInstances[0].DBInstanceStatus" \
          --output text 2>/dev/null || echo "NOT_FOUND")
          
          if [ "$STATUS" = "NOT_FOUND" ]; then
            echo "✅ RDS Instance NÃO existe mais na AWS (destroy confirmado)"
          elif [ "$STATUS" = "deleting" ]; then
            echo "⏳ RDS Instance ainda em processo de deleção (deleting)"
          else
            echo "❌ RDS Instance ainda EXISTE na AWS (status: $STATUS)"
          exit 1
          fi

        # RDS pode levar um tempo para ser totalmente removido, então vamos esperar e verificar novamente
      - name: Wait for RDS to be fully destroyed
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          MAX_RETRIES=20
          SLEEP_TIME=30
      
          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔎 Tentativa $i/$MAX_RETRIES: verificando RDS..."
      
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier example-postgres-db \
              --region $AWS_REGION \
              --query "DBInstances[0].DBInstanceStatus" \
              --output text 2>/dev/null || echo "NOT_FOUND")
      
            if [ "$STATUS" = "NOT_FOUND" ]; then
              echo "✅ RDS foi totalmente removido da AWS"
              exit 0
            fi
      
            echo "⏳ RDS ainda existe (status: $STATUS). Aguardando ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
          done
          
          echo "❌ Timeout: RDS não foi removido após $((MAX_RETRIES * SLEEP_TIME)) segundos"
          exit 1
    

        # validates the destroy by checking if the RDS security group still exists in AWS
      - name: Validate RDS Security Group is destroyed in AWS
        if: env.TF_ACTION == 'destroy'
        working-directory: terraform
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters \
              Name=group-name,Values=rds-postgres-sg \
              Name=vpc-id,Values=$VPC_ID \
            --query "SecurityGroups[0].GroupId" \
            --output text \
            --region $AWS_REGION)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            echo "✅ RDS Security Group NÃO existe mais na AWS (destroy confirmado)"
          else
            echo "⏳ RDS Security Group ainda existe (provavelmente aguardando RDS liberar)"
            echo "   SG_ID: $SG_ID"
          fi